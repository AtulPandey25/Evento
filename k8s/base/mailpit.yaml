apiVersion: v1
kind: Service
metadata:
  name: mailpit
  labels:
    app.kubernetes.io/name: evento
    app.kubernetes.io/component: mailpit
spec:
  selector:
    app.kubernetes.io/component: mailpit
  ports:
    - name: smtp
      port: 1025
      targetPort: 1025
    - name: web
      port: 8025
      targetPort: 8025
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mailpit
  labels:
    app.kubernetes.io/name: evento
    app.kubernetes.io/component: mailpit
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: mailpit
  template:
    metadata:
      labels:
        app.kubernetes.io/name: evento
        app.kubernetes.io/component: mailpit
    spec:
      containers:
        - name: mailpit
          image: axllent/mailpit:v1.30
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 1025
              name: smtp
            - containerPort: 8025
              name: web
          readinessProbe:
            exec:
              command: ["/mailpit", "readyz"]
            initialDelaySeconds: 5
            periodSeconds: 10
