apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  labels:
    app.kubernetes.io/name: evento
    app.kubernetes.io/component: api-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: api-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: evento
        app.kubernetes.io/component: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: evento/api-gateway
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
          envFrom:
            - configMapRef:
                name: evento-config
            - secretRef:
                name: evento-secret
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  labels:
    app.kubernetes.io/name: evento
    app.kubernetes.io/component: api-gateway
spec:
  type: NodePort
  selector:
    app.kubernetes.io/component: api-gateway
  ports:
    - name: http
      port: 3000
      targetPort: 3000
      nodePort: 30080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: client
  labels:
    app.kubernetes.io/name: evento
    app.kubernetes.io/component: client
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: client
  template:
    metadata:
      labels:
        app.kubernetes.io/name: evento
        app.kubernetes.io/component: client
    spec:
      containers:
        - name: client
          image: evento/client
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4000
              name: http
          env:
            - name: NEXT_PUBLIC_API_BASE_URL
              value: http://localhost:30080
          readinessProbe:
            httpGet:
              path: /events
              port: 4000
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: client
  labels:
    app.kubernetes.io/name: evento
    app.kubernetes.io/component: client
spec:
  type: NodePort
  selector:
    app.kubernetes.io/component: client
  ports:
    - name: http
      port: 4000
      targetPort: 4000
      nodePort: 30040
