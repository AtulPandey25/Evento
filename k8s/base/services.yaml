apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  labels:
    app.kubernetes.io/name: evento
    app.kubernetes.io/component: auth-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: auth-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: evento
        app.kubernetes.io/component: auth-service
    spec:
      containers:
        - name: auth-service
          image: evento/auth-service
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3001
              name: http
          envFrom:
            - configMapRef:
                name: evento-config
            - secretRef:
                name: evento-secret
          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  labels:
    app.kubernetes.io/name: evento
    app.kubernetes.io/component: auth-service
spec:
  selector:
    app.kubernetes.io/component: auth-service
  ports:
    - name: http
      port: 3001
      targetPort: 3001
---
